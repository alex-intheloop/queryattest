name: Feature or hardening proposal
description: Propose a scoped improvement with an explicit evidence or safety outcome.
title: "[Proposal]: "
labels: ["enhancement", "needs-design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user need, invariant, evidence gap, or operational risk is not addressed today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable acceptance criteria rather than only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Trust-boundary impact
      description: Explain effects on identity, authorization, execution, verification, audit, or compatibility.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: tests
    attributes:
      label: Proposed tests or evidence
      description: List positive, negative, and adversarial cases where relevant.
